info:
  title: SideQuest API
  description: Gamified exploration platform - REST API
  version: "1"
  contact: {}
tags:
  - name: auth
    description: ""
  - name: users
    description: ""
  - name: quests
    description: ""
  - name: achievements
    description: ""
  - name: map
    description: ""
  - name: friendships
    description: ""
  - name: businesses
    description: ""
  - name: notifications
    description: ""
  - name: uploads
    description: ""
  - name: health
    description: ""
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Paste the access token returned by /auth/login
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: wanderer@prague.cz
        username:
          type: string
          example: praguewanderer
        password:
          type: string
          example: CorrectHorseBatteryStaple!
        displayName:
          type: string
      required:
        - email
        - username
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: wanderer@prague.cz
        password:
          type: string
      required:
        - email
        - password
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    UpdateUserDto:
      type: object
      properties:
        displayName:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: number
        limit:
          type: number
        total:
          type: number
        totalPages:
          type: number
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNext
        - hasPrev
    UserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        displayName:
          type: object
        avatarUrl:
          type: object
        bio:
          type: object
        role:
          type: string
          enum:
            - USER
            - MODERATOR
            - ADMIN
            - BUSINESS_OWNER
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DELETED
        xp:
          type: number
        level:
          type: number
        questsDone:
          type: number
        streakDays:
          type: number
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - email
        - username
        - role
        - status
        - xp
        - level
        - questsDone
        - streakDays
        - createdAt
        - updatedAt
    QuestLocationDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: object
        address:
          type: object
        latitude:
          type: number
        longitude:
          type: number
        radiusM:
          type: number
        orderIndex:
          type: number
        distanceM:
          type: number
          description: Distance in meters from the requested point
      required:
        - id
        - latitude
        - longitude
        - radiusM
        - orderIndex
    QuestDto:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        summary:
          type: object
        description:
          type: string
        difficulty:
          type: string
          enum:
            - EASY
            - MEDIUM
            - HARD
            - EPIC
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        xpReward:
          type: number
        estimatedDurationMin:
          type: object
        imageUrl:
          type: object
        coverImageUrl:
          type: object
        categoryId:
          type: object
        businessId:
          type: object
        authorId:
          type: object
        publishedAt:
          type: object
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        locations:
          type: array
          items:
            $ref: "#/components/schemas/QuestLocationDto"
        distanceM:
          type: number
          description: Distance in meters to the nearest location (nearby search)
      required:
        - id
        - slug
        - title
        - description
        - difficulty
        - status
        - xpReward
        - createdAt
        - updatedAt
    CreateQuestLocationDto:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        radiusM:
          type: number
          default: 50
        orderIndex:
          type: number
          default: 0
      required:
        - latitude
        - longitude
    CreateQuestDto:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum:
            - EASY
            - MEDIUM
            - HARD
            - EPIC
          default: EASY
        xpReward:
          type: number
          default: 50
        estimatedDurationMin:
          type: number
        categoryId:
          type: string
