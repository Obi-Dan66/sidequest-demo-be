openapi: 3.0.0
paths:
  /api/v1/auth/me:
    get:
      operationId: AuthController_me
      summary: Return the currently authenticated user
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - auth
      security:
        - access-token: []
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      summary: Register a new user account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: ""
      tags:
        - auth
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      summary: Authenticate and obtain access + refresh tokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: ""
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Exchange a refresh token for a new token pair
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: ""
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      summary: Revoke the current refresh token for the user
      parameters: []
      responses:
        "204":
          description: ""
      tags:
        - auth
      security:
        - access-token: []
  /api/v1/users/me:
    get:
      operationId: UsersController_getMe
      summary: Get current authenticated user
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - users
      security:
        - access-token: []
    patch:
      operationId: UsersController_updateMe
      summary: Update current authenticated user profile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: ""
      tags:
        - users
      security:
        - access-token: []
  /api/v1/users/me/stats:
    get:
      operationId: UsersController_getMyStats
      summary: Get gamification stats for the current user
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - users
      security:
        - access-token: []
  /api/v1/users/me/avatar:
    post:
      operationId: UsersController_uploadAvatar
      summary: Upload (or replace) the current user avatar
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
      tags:
        - users
      security:
        - access-token: []
  /api/v1/users:
    get:
      operationId: UsersController_list
      summary: List users (paginated)
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: search
          required: false
          in: query
          description: Free-text search query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserDto"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/PaginationMeta"
      tags:
        - users
      security:
        - access-token: []
  /api/v1/users/{id}:
    get:
      operationId: UsersController_getById
      summary: Get user by id
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - users
      security:
        - access-token: []
  /api/v1/users/{id}/stats:
    get:
      operationId: UsersController_getStats
      summary: Get public gamification stats for a user
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - users
      security:
        - access-token: []
  /api/v1/uploads:
    post:
      operationId: UploadsController_upload
      summary: Upload a file (image)
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
      tags:
        - uploads
      security:
        - access-token: []
  /api/v1/quests:
    get:
      operationId: QuestsController_list
      summary: List quests (filterable, paginated)
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: search
          required: false
          in: query
          description: Free-text search query
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            enum:
              - DRAFT
              - PUBLISHED
              - ARCHIVED
            type: string
        - name: difficulty
          required: false
          in: query
          schema:
            enum:
              - EASY
              - MEDIUM
              - HARD
              - EPIC
            type: string
        - name: categorySlug
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuestDto"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/PaginationMeta"
      tags:
        - quests
      security:
        - access-token: []
    post:
      operationId: QuestsController_create
      summary: Create a new quest (admin/moderator/business owner)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestDto"
      responses:
        "201":
          description: ""
      tags:
        - quests
      security:
        - access-token: []
  /api/v1/quests/nearby:
    get:
      operationId: QuestsController_listNearby
      summary: List quests near coordinates (radius search)
      parameters:
        - name: lat
          required: false
          in: query
          schema:
            minimum: -90
            maximum: 90
            type: number
        - name: lng
          required: false
          in: query
          schema:
            minimum: -180
            maximum: 180
            type: number
        - name: radiusM
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100000
            default: 5000
            type: number
        - name: difficulty
          required: false
          in: query
          schema:
            enum:
              - EASY
              - MEDIUM
              - HARD
              - EPIC
            type: string
        - name: categorySlug
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - quests
      security:
        - access-token: []
  /api/v1/quests/{id}:
    get:
      operationId: QuestsController_getById
      summary: Get quest by id
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - quests
      security:
        - access-token: []
    patch:
      operationId: QuestsController_update
      summary: Update a quest (author or admin/moderator only)
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestDto"
      responses:
        "200":
          description: ""
      tags:
        - quests
      security:
        - access-token: []
    delete:
      operationId: QuestsController_delete
      summary: Delete a quest (author or admin/moderator only)
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      responses:
        "204":
          description: ""
      tags:
        - quests
      security:
        - access-token: []
  /api/v1/quests/{id}/start:
    post:
      operationId: QuestsController_start
      summary: Mark a quest as started for the current user
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      responses:
        "201":
          description: ""
      tags:
        - quests
      security:
        - access-token: []
  /api/v1/quests/{id}/complete:
    post:
      operationId: QuestsController_complete
      summary: Mark a quest as completed for the current user
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      responses:
        "201":
          description: ""
      tags:
        - quests
      security:
        - access-token: []
  /api/v1/quest-categories:
    get:
      operationId: QuestCategoriesController_list
