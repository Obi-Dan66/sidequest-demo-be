  /api/v1/friendships/activity:
    get:
      operationId: FriendshipsController_activity
      summary: Recent activity from my friends (quest completions + achievements)
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: ""
      tags:
        - friendships
      security:
        - access-token: []
  /api/v1/friendships/{id}/accept:
    post:
      operationId: FriendshipsController_accept
      summary: Accept a pending friend request
      parameters:
        - name: id
          required: true
          in: path
          description: CUID identifier
          schema:
            type: string
      responses:
        "201":
          description: ""
      tags:
        - friendships
      security:
        - access-token: []
  /api/v1/friendships/block/{userId}:
    post:
      operationId: FriendshipsController_block
      summary: Block another user
      parameters:
        - name: userId
          required: true
          in: path
