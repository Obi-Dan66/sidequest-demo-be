      responses:
        "200":
          description: ""
      tags:
        - achievements
      security:
        - access-token: []
  /api/v1/map/pins:
    get:
      operationId: MapController_getPins
      summary: Get map pins inside a viewport bounding box
      parameters:
        - name: south
          required: false
          in: query
          schema:
            minimum: -90
            maximum: 90
            type: number
        - name: north
          required: false
          in: query
          schema:
            minimum: -90
            maximum: 90
            type: number
        - name: west
          required: false
          in: query
          schema:
            minimum: -180
            maximum: 180
            type: number
        - name: east
          required: false
          in: query
          schema:
            minimum: -180
            maximum: 180
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 1000
            default: 200
            type: number
        - name: categorySlug
          required: false
          in: query
          description: Filter pins by quest category slug
          schema:
            type: string
        - name: difficulty
          required: false
          in: query
          schema:
            enum:
              - EASY
              - MEDIUM
              - HARD
              - EPIC
            type: string
        - name: kinds
          required: false
          in: query
          description: "Restrict pin kinds (comma-separated): QUEST, BUSINESS"
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - map
  /api/v1/friendships:
    get:
      operationId: FriendshipsController_listMine
      summary: List my friendships (filterable by status)
      parameters:
        - name: status
          required: false
          in: query
          schema:
            enum:
              - PENDING
              - ACCEPTED
              - BLOCKED
