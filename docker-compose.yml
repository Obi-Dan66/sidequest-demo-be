services:
  db:
    image: postgres:16-alpine
    container_name: sidequest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidequest}
      POSTGRES_DB: ${POSTGRES_DB:-sidequest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sidequest_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sidequest} -d ${POSTGRES_DB:-sidequest}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sidequest-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sidequest}:${POSTGRES_PASSWORD:-sidequest}@db:5432/${POSTGRES_DB:-sidequest}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-me-access}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-me-refresh}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_PREFIX: ${API_PREFIX:-api}
      API_DEFAULT_VERSION: ${API_DEFAULT_VERSION:-1}
    ports:
      - '${PORT:-3000}:3000'
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  sidequest_db_data:
    driver: local
